[package]
name = "freq_timer"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance wall clock library with nanosecond precision"
license = "MIT OR Apache-2.0"

[lib]
name = "freq_timer"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"
once_cell = "1.19"

[build-dependencies]
cbindgen = "0.26"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
approx = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
opt-level = 3

[[bench]]
name = "performance"
harness = false